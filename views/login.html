<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SmartHospital hastane otomasyonu kullanıcı girişi">
    <title>Giriş Yap | SmartHospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container page-container">
            <a class="navbar-brand" href="login.html">SmartHospital</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Menüyü aç veya kapat">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" aria-current="page" href="login.html">Giriş</a>
                    <a class="nav-link" href="yonetim.html">Yönetim</a>
                    <a class="nav-link" href="randevular.html">Randevular</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container page-container login-main d-flex flex-column justify-content-center py-5">
        <div class="login-wrap">
            <div class="login-heading text-center mb-4">
                <span class="login-brand-mark mb-3">SH</span>
                <p class="text-uppercase small fw-semibold text-primary mb-2">Hastane otomasyon sistemi</p>
                <h1 class="h2 fw-bold mb-2">Hoş geldiniz</h1>
                <p class="text-muted-custom mb-0">Devam etmek için kullanıcı bilgilerinizi girin.</p>
            </div>

            <section class="card hospital-card">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h5 card-title mb-4">Hesabınıza giriş yapın</h2>
                    <form method="post" action="../api/login.php" data-login-form>
                        <div class="mb-3">
                            <label for="identifier" class="form-label">Kullanıcı adı veya e-posta</label>
                            <input type="text" class="form-control" id="identifier" name="identifier" autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Şifre</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                                <button class="btn btn-outline-primary" type="button" data-password-toggle aria-controls="password" aria-pressed="false">Göster</button>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Giriş Yap</button>
                            <button type="reset" class="btn btn-outline-primary">Temizle</button>
                        </div>
                        <div class="alert alert-danger mt-3 mb-0 d-none" role="alert" aria-live="assertive" data-login-feedback></div>
                    </form>
                </div>
            </section>
            <p class="small text-center text-muted-custom mt-3 mb-0">Erişim yetkiniz hesabınızdaki rol bilgisine göre belirlenir.</p>
        </div>
    </main>

    <footer class="app-footer text-center py-3">SmartHospital &copy; 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/app.js" defer></script>
</body>
</html>
