<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartHospital - Hasta Yönetimi</title>
  <link rel="stylesheet" href="patients.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <div>
        <h1>Hasta Yönetimi</h1>
        <p class="subtitle">SmartHospital ortak hasta kayıt, arama, güncelleme ve silme modülü</p>
      </div>
      <nav class="top-nav">
        <a href="../appointments/index.html" class="nav-link">Randevu Yönetimi</a>
      </nav>
    </header>

    <main class="content-grid">
      <section class="card form-card">
        <h2 id="formTitle">Yeni Hasta Kaydı</h2>
        <form id="patientForm" novalidate>
          <input type="hidden" id="patientId" name="id" />

          <div class="form-group">
            <label for="tcNo">T.C. Kimlik No (11 Hane) *</label>
            <input type="text" id="tcNo" name="tc_no" maxlength="11" inputmode="numeric" required placeholder="Örn: 12345678901" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="firstName">Ad *</label>
              <input type="text" id="firstName" name="first_name" maxlength="80" required placeholder="Ad" />
            </div>

            <div class="form-group">
              <label for="lastName">Soyad *</label>
              <input type="text" id="lastName" name="last_name" maxlength="80" required placeholder="Soyad" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="birthDate">Doğum Tarihi</label>
              <input type="date" id="birthDate" name="birth_date" />
            </div>

            <div class="form-group">
              <label for="gender">Cinsiyet</label>
              <select id="gender" name="gender">
                <option value="">Seçiniz</option>
                <option value="female">Kadın</option>
                <option value="male">Erkek</option>
                <option value="other">Diğer</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Telefon</label>
              <input type="text" id="phone" name="phone" maxlength="30" placeholder="05xx xxx xx xx" />
            </div>

            <div class="form-group">
              <label for="email">E-posta</label>
              <input type="email" id="email" name="email" maxlength="150" placeholder="ornek@eposta.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="address">Adres</label>
            <textarea id="address" name="address" rows="3" placeholder="Açık adres bilgisi"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">Kaydet</button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">İptal</button>
          </div>
        </form>
        <div id="formFeedback" class="feedback" role="status" aria-live="polite"></div>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>Kayıtlı Hastalar</h2>
          <div class="filter-bar">
            <input type="search" id="searchInput" placeholder="Ad, soyad veya T.C. ile ara..." />
            <select id="genderFilter">
              <option value="">Tüm Cinsiyetler</option>
              <option value="female">Kadın</option>
              <option value="male">Erkek</option>
              <option value="other">Diğer</option>
            </select>
            <button type="button" id="refreshBtn" class="btn btn-secondary">Yenile</button>
          </div>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>T.C. No</th>
                <th>Ad Soyad</th>
                <th>Doğum Tarihi</th>
                <th>Cinsiyet</th>
                <th>Telefon</th>
                <th>E-posta</th>
                <th>İşlemler</th>
              </tr>
            </thead>
            <tbody id="patientsTableBody">
              <tr>
                <td colspan="8" class="empty-row">Kayıtlar yükleniyor...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="patients.js"></script>
</body>
</html>
