<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartHospital - Muayene ve Reçete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container p-4">
  <h3 class="mb-4">Muayene ve Reçete</h3>
  <div id="mesaj" class="alert d-none"></div>

  <div class="row g-4">
    <!-- Sol: bilgi kartı + geçmiş -->
    <div class="col-md-5">
      <div class="card mb-3">
        <div class="card-header">Hasta Bilgisi</div>
        <div class="card-body" id="bilgiKarti">
          <span class="text-muted">Lütfen bir randevu seçin.</span>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Geçmiş Muayeneler</div>
        <ul class="list-group list-group-flush" id="gecmisListesi">
          <li class="list-group-item text-muted">Randevu seçilmedi.</li>
        </ul>
      </div>
    </div>

    <!-- Sağ: Form 4 -->
    <div class="col-md-7">
      <div class="card">
        <div class="card-header">Muayene Formu</div>
        <div class="card-body">
          <form id="muayeneFormu">
            <div class="mb-3">
              <label class="form-label" for="randevu_id">Randevu</label>
              <select class="form-select" id="randevu_id"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="sikayet">Şikayet *</label>
              <textarea class="form-control" id="sikayet" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="tani">Tanı *</label>
              <textarea class="form-control" id="tani" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="recete">Reçete</label>
              <textarea class="form-control" id="recete" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="notlar">Notlar</label>
              <input type="text" class="form-control" id="notlar">
            </div>
            <button type="submit" class="btn btn-success">Muayeneyi Kaydet ve Tamamla</button>
            <button type="reset" class="btn btn-outline-secondary">Formu Temizle</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function temiz(metin) {
  const d = document.createElement('div');
  d.textContent = metin ?? '';
  return d.innerHTML;
}
function mesajGoster(metin, tur) {
  const m = document.getElementById('mesaj');
  m.className = 'alert alert-' + tur;
  m.textContent = metin;
}

// Bugünün işlem bekleyen randevularını açılır listeye doldurur
async function randevulariYukle(secilecekId) {
  const secim = document.getElementById('randevu_id');
  try {
    const sonuc = await (await fetch('../../backend/php/api/dashboard/dashboard_summary.php')).json();
    if (!sonuc.ok) throw new Error(sonuc.message);
    const uygun = sonuc.data.bugunun_randevulari.filter(r => r.durum === 'bekliyor' || r.durum === 'muayenede');
    secim.innerHTML = '<option value="">-- Randevu seçin --</option>' + uygun.map(r =>
      '<option value="' + temiz(r.id) + '">' + temiz(r.randevu_saati.substring(0, 5)) + ' - ' +
      temiz(r.hasta_adi) + ' (' + temiz(r.poliklinik) + ')</option>').join('');
    if (secilecekId) { secim.value = secilecekId; gecmisYukle(); }
  } catch (e) {
    mesajGoster('Randevular alınamadı: ' + e.message, 'danger');
  }
}

// Seçili randevunun hasta bilgisi ve geçmişi
async function gecmisYukle() {
  const id = document.getElementById('randevu_id').value;
  const bilgi = document.getElementById('bilgiKarti');
  const liste = document.getElementById('gecmisListesi');
  if (!id) {
    bilgi.innerHTML = '<span class="text-muted">Lütfen bir randevu seçin.</span>';
    liste.innerHTML = '<li class="list-group-item text-muted">Randevu seçilmedi.</li>';
    return;
  }
  try {
    const sonuc = await (await fetch('../../backend/php/api/examinations/examination_history.php?randevu_id=' + encodeURIComponent(id))).json();
    if (!sonuc.ok) throw new Error(sonuc.message);
    const r = sonuc.data.randevu;
    bilgi.innerHTML = '<b>' + temiz(r.hasta_adi) + '</b><br>T.C. No: ' + temiz(r.tc_no) +
      '<br>Poliklinik: ' + temiz(r.poliklinik) + '<br>Doktor: ' + temiz(r.doktor);
    const g = sonuc.data.gecmis;
    liste.innerHTML = g.length === 0
      ? '<li class="list-group-item text-muted">Daha önce muayene kaydı yok.</li>'
      : g.map(m => '<li class="list-group-item"><small class="text-muted">' + temiz(m.olusturma_tarihi) +
          ' - ' + temiz(m.doktor) + '</small><br><b>Tanı:</b> ' + temiz(m.tani) +
          '<br><b>Reçete:</b> ' + temiz(m.recete || '-') + '</li>').join('');
  } catch (e) {
    mesajGoster('Geçmiş alınamadı: ' + e.message, 'danger');
  }
}

document.getElementById('randevu_id').addEventListener('change', gecmisYukle);

document.getElementById('muayeneFormu').addEventListener('submit', async function (olay) {
  olay.preventDefault();
  const randevuId = document.getElementById('randevu_id').value;
  const sikayet = document.getElementById('sikayet').value.trim();
  const tani = document.getElementById('tani').value.trim();
  const recete = document.getElementById('recete').value.trim();

  // Sunucuya gitmeden önce boş alan kontrolü
  if (!randevuId) { mesajGoster('Lütfen bir randevu seçin.', 'danger'); return; }
  if (sikayet === '' || tani === '') { mesajGoster('Şikayet ve tanı alanları boş bırakılamaz.', 'danger'); return; }

  try {
    const cevap = await fetch('../../backend/php/api/examinations/examination_save.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ randevu_id: randevuId, sikayet: sikayet, tani: tani, recete: recete })
    });
    const sonuc = await cevap.json();
    if (!sonuc.ok) throw new Error(sonuc.message);
    mesajGoster(sonuc.message, 'success');
    document.getElementById('muayeneFormu').reset();
    await randevulariYukle();   // tamamlanan randevu listeden düşer
    gecmisYukle();
  } catch (e) {
    mesajGoster(e.message, 'danger');
  }
});

// Randevular ekranından ?randevu_id=3 ile gelinirse otomatik seçilir
randevulariYukle(new URLSearchParams(location.search).get('randevu_id'));
</script>
</body>
</html>
